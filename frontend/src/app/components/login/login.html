<!-- login.component.html -->
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">{{ isSignUp ? 'Create Account' : 'Sign In' }}</h2>
  
  <form (ngSubmit)="submit()" class="space-y-4">
    <!-- Username -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">Username</label>
      <input type="text" [(ngModel)]="form.username" name="username" required
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Extra fields for Sign Up matching database schema -->
    @if (isSignUp) {
      <div>
        <label class="block text-sm font-semibold text-gray-700">Email Address</label>
        <input type="email" [(ngModel)]="form.email" name="email" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Contact Number</label>
        <input type="text" [(ngModel)]="form.contactNo" name="contactNo"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>
    }

    <!-- Password -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">Password</label>
      <input type="password" [(ngModel)]="form.password" name="password" required
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Role Selection -->
    @if (isSignUp) {
      <div>
        <label class="block text-sm font-semibold text-gray-700">Account Type</label>
        <select [(ngModel)]="form.role" name="role" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
          <option value="USER">Standard User</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>
    }

    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
      {{ isSignUp ? 'Sign Up' : 'Log In' }}
    </button>
  </form>

  <button (click)="isSignUp = !isSignUp" class="mt-4 text-sm text-indigo-600 hover:underline">
    {{ isSignUp ? 'Already have an account? Log In' : 'Need an account? Sign Up' }}
  </button>
</div>
