<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    
    <!-- Brand Logo -->
    <a routerLink="/" class="text-2xl font-black tracking-tight text-indigo-600 hover:text-indigo-700 transition-colors shrink-0">
      E-STORE
    </a>

    <!-- Search Bar -->
    <div class="flex-1 max-w-md relative mx-4">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <input
        type="text"
        [value]="productService.searchTerm()"
        (input)="onSearch($event)"
        placeholder="Search products by name or category..."
        class="w-full pl-10 pr-8 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent bg-gray-50/50"
      />
      @if (productService.searchTerm()) {
        <button 
          (click)="clearSearch()" 
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 text-sm">
          ✕
        </button>
      }
    </div>
    
    <!-- Navigation Links & Actions -->
    <nav class="flex items-center gap-5 shrink-0">
      <a routerLink="/" class="text-gray-600 hover:text-indigo-600 font-medium text-sm transition-colors hidden sm:inline-block">
        Shop
      </a>

      <!-- Manage Admin / Login Button -->
      <a routerLink="/login" class="text-gray-700 hover:text-indigo-600 font-medium text-xs sm:text-sm px-3 py-1.5 rounded-full border border-gray-200 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-200 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4 text-gray-500 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
        </svg>
        Login
      </a>

      <!-- Shopping Cart Badge -->
      <div class="relative cursor-pointer group p-1">
        <span class="text-2xl transition-transform group-hover:scale-110 inline-block">🛒</span>
        @if (cartCount() > 0) {
          <span class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center animate-pulse shadow-sm">
            {{ cartCount() }}
          </span>
        }
      </div>
    </nav>
  </div>
</header>
